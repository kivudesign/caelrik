name: PR labels

# Labels each pull request from the tags that start its title, for the release notes
# categories (.github/release.yml). CONTRIBUTING.md lists the tags.
#
#   [MOD] [REM]                         breaking
#   [NEW]                               feature
#   [ENH] [UI] [UX] [TRA]               enhancement
#   [SEC]                               security
#   [FIX]                               bug
#   [DOC]                               documentation
#   [UPD]                               dependencies
#   [REF] [KIL] [DB] [BP] [MRG] [REL]   maintenance
#   "a11y" in the scope ([FIX] a11y:)   accessibility, plus the tag's label
#
# Several tags add up: "[FIX][SEC] upload: …" gets bug and security.
#
# pull_request_target runs with the base repository's token, so pull requests from
# forks get labels too. It only reads the title: no code from the pull request runs.

on:
  pull_request_target:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const managed = ['breaking', 'feature', 'enhancement', 'security', 'accessibility', 'bug', 'documentation', 'dependencies', 'maintenance'];
            const labels = {
              MOD: 'breaking', REM: 'breaking',
              NEW: 'feature',
              ENH: 'enhancement', UI: 'enhancement', UX: 'enhancement', TRA: 'enhancement',
              SEC: 'security',
              FIX: 'bug',
              DOC: 'documentation',
              UPD: 'dependencies',
              REF: 'maintenance', KIL: 'maintenance', DB: 'maintenance', BP: 'maintenance', MRG: 'maintenance', REL: 'maintenance',
            };
            const title = context.payload.pull_request.title;
            // "[FIX][SEC] upload, a11y: summary": the tags, then an optional scope.
            const match = /^((?:\s*\[[A-Za-z]+\])+)\s*(?:([\w\-./, ]+):)?/.exec(title);
            const wanted = new Set();
            if (match) {
              for (const [, tag] of match[1].matchAll(/\[([A-Za-z]+)\]/g)) {
                const label = labels[tag.toUpperCase()];
                if (label) wanted.add(label);
              }
              const scopes = (match[2] ?? '').split(',').map((scope) => scope.trim().toLowerCase());
              if (wanted.size > 0 && scopes.includes('a11y')) wanted.add('accessibility');
            }

            const issue = { owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.pull_request.number };
            const current = context.payload.pull_request.labels.map((label) => label.name);
            for (const name of current.filter((name) => managed.includes(name) && !wanted.has(name))) {
              await github.rest.issues.removeLabel({ ...issue, name });
            }
            const missing = [...wanted].filter((name) => !current.includes(name));
            if (missing.length > 0) {
              await github.rest.issues.addLabels({ ...issue, labels: missing });
            }
            core.info(`"${title}": ${[...wanted].join(', ') || 'no label (Other changes)'}`);
